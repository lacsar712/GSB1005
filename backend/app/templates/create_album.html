{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-8">
        <a href="{{ url_for('album_detail', album_id=album.id) if mode == 'edit' else url_for('index') }}" class="text-gray-500 hover:text-gray-700 text-sm flex items-center mb-4">
            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            返回
        </a>
        <h1 class="text-3xl font-bold text-gray-900">{{ '编辑相册' if mode == 'edit' else '新建相册' }}</h1>
    </div>
    
    <div class="bg-white rounded-xl shadow-sm p-8 border border-gray-100">
        <form method="POST" onsubmit="return handleFormSubmit(this)">
            <div class="mb-6">
                <label for="title" class="block text-sm font-medium text-gray-700 mb-1">相册名称 <span class="text-red-500">*</span></label>
                <input type="text" name="title" id="title" required placeholder="例如：2026年春节"
                    value="{{ album.title if mode == 'edit' and album else '' }}"
                    maxlength="100"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition">
                <p class="text-xs text-gray-400 mt-1"><span id="titleCount">0</span>/100</p>
            </div>
            
            <div class="mb-8">
                <label for="description" class="block text-sm font-medium text-gray-700 mb-1">描述 (可选)</label>
                <textarea name="description" id="description" rows="4" placeholder="记录美好时刻..."
                    maxlength="500"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition resize-none">{{ album.description if mode == 'edit' and album and album.description else '' }}</textarea>
                <p class="text-xs text-gray-400 mt-1"><span id="descCount">0</span>/500</p>
            </div>
            
            <div class="flex justify-end space-x-4">
                <a href="{{ url_for('album_detail', album_id=album.id) if mode == 'edit' else url_for('index') }}" class="px-6 py-2.5 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition">取消</a>
                <button type="submit" class="px-6 py-2.5 bg-primary hover:bg-blue-600 text-white rounded-lg shadow-sm transition">
                    {{ '保存修改' if mode == 'edit' else '创建相册' }}
                </button>
            </div>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var titleInput = document.getElementById('title');
    var descInput = document.getElementById('description');
    var titleCount = document.getElementById('titleCount');
    var descCount = document.getElementById('descCount');

    function updateCount(input, counter) {
        counter.textContent = input.value.length;
    }

    if (titleInput && titleCount) {
        updateCount(titleInput, titleCount);
        titleInput.addEventListener('input', function() { updateCount(titleInput, titleCount); });
    }
    if (descInput && descCount) {
        updateCount(descInput, descCount);
        descInput.addEventListener('input', function() { updateCount(descInput, descCount); });
    }
});
</script>
{% endblock %}
